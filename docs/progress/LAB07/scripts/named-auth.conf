options {
    directory "/var/cache/bind";
    listen-on { 10.0.0.2; };
    listen-on-v6 { none; };
    allow-query { any; };
    recursion no;
    key-directory "/var/cache/bind/keys";
};

zone "lab.test" {
    type primary;
    file "/var/cache/bind/db.lab.test";
    dnssec-policy default;
    inline-signing yes;
};

